services:
  db:
    image: postgres:16-alpine
    container_name: whatsapp-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: whatsapp_secret_db_pass_2026
      POSTGRES_DB: whatsapp_bot
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: whatsapp-bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-whatsapp_secret_db_pass_2026}@db:5432/whatsapp_bot?schema=public
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=3000
      - NODE_ENV=production
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
